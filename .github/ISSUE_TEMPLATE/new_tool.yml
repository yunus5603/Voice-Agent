name: Question pack or interviewer tool
description: Propose a question pack for a role, or a new tool the interviewer can call
labels: [enhancement, tool]
body:
  - type: textarea
    id: goal
    attributes:
      label: What should the interviewer be able to do, or which role needs a pack?
      placeholder: 'A question pack for data engineering interviews'
    validations:
      required: true
  - type: textarea
    id: signature
    attributes:
      label: Proposed questions or tool signature
      render: yaml
      placeholder: |
        - id: pipeline-backfill
          text: How would you backfill a year of data into a pipeline that is running?
  - type: textarea
    id: failure
    attributes:
      label: Failure behaviour
      description: What should the agent say if this tool is slow or fails?
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself
