name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you say or do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. uv run uvicorn voice_agent.server:app --port 8002
        2. Connect the microphone
        3. Say "find a room after three"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: Paste relevant lines. Remove API keys and anything private first.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15, Chrome 131, Python 3.12, google-adk 2.7
