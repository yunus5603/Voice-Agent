id: behavioral
title: Behavioural (any role)
interview_type: behavioral
keywords: []
criteria:
  - name: Situation and task
    description: Sets up the context and their own responsibility briefly and concretely.
  - name: Action
    description: Explains what they personally did and why, not what "we" did.
  - name: Result
    description: States the outcome with a number, a before/after or clear evidence.
  - name: Reflection
    description: Names what they learned or would do differently.
questions:
  - id: proud-project
    text: Tell me about a project you're most proud of. What was your part in it?
    probes: Ownership, impact and how they explain their own contribution.
    follow_ups:
      - What would have happened if you hadn't been on that project?
      - How did you measure whether it worked?
  - id: conflict
    text: Tell me about a time you disagreed with a teammate or manager about a technical decision.
    probes: Handling disagreement with evidence and respect, and committing once decided.
    follow_ups:
      - How did you try to understand their side?
      - Looking back, who was right?
  - id: failure
    text: Describe a time something you built or shipped went wrong. What happened next?
    probes: Accountability, debugging under pressure and learning from mistakes.
    follow_ups:
      - What did you change so it wouldn't happen again?
      - How did you communicate it to the people affected?
  - id: ambiguity
    text: Tell me about a time you had to deliver something with unclear requirements.
    probes: Handling ambiguity by asking, scoping and iterating.
    follow_ups:
      - What did you decide not to build?
      - How did you know you were done?
  - id: tight-deadline
    text: Tell me about a time you had to deliver under a tight deadline. What did you trade off?
    probes: Prioritisation and conscious trade-offs between speed and quality.
    follow_ups:
      - What corners did you refuse to cut?
      - Did the trade-off cost you anything later?
  - id: learn-fast
    text: Tell me about a time you had to learn a new technology quickly to get something done.
    probes: Learning approach and speed to useful output.
    follow_ups:
      - How did you know your understanding was good enough?
      - What would you tell someone starting with it today?
  - id: feedback
    text: Tell me about the most useful piece of critical feedback you've received.
    probes: Coachability and self-awareness.
    follow_ups:
      - What did you do differently afterwards?
