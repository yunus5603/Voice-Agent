id: backend
title: Backend engineering
interview_type: technical
keywords: [backend, api, apis, rest, grpc, microservice, microservices, database, postgres, sql, distributed, scalability, kafka, redis, python, go, java, fastapi, django, server]
criteria:
  - name: Correctness
    description: The approach works and handles the main edge cases.
  - name: Depth
    description: Goes beyond the first answer into internals, failure modes and limits.
  - name: Trade-offs
    description: Names alternatives and explains why one fits this situation.
  - name: Clarity
    description: Structured explanation that a teammate could follow.
questions:
  - id: design-rate-limiter
    text: How would you design a rate limiter for a public API?
    probes: Algorithm choice, distributed state and behaviour under load.
    follow_ups:
      - How does it work across many API servers?
      - What do clients see when they're limited, and why?
  - id: slow-endpoint
    text: An endpoint that used to take 100 milliseconds now takes 3 seconds. How do you investigate?
    probes: Systematic debugging, observability and knowing where latency hides.
    follow_ups:
      - What would you check in the database first?
      - How would you prevent this from reaching users next time?
  - id: idempotency
    text: How do you make a payment API safe to retry?
    probes: Idempotency keys, at-least-once delivery and consistency.
    follow_ups:
      - Where would you store the idempotency keys, and for how long?
      - What happens if the request times out halfway through?
  - id: sql-vs-nosql
    text: When would you choose a relational database over a document store?
    probes: Data modelling, consistency needs and query patterns.
    follow_ups:
      - Tell me about a time the choice turned out wrong.
  - id: background-jobs
    text: How would you design a system that sends a million notification emails reliably?
    probes: Queues, retries, back-pressure and failure isolation.
    follow_ups:
      - How do you avoid sending the same email twice?
      - How do you know if it's falling behind?
  - id: schema-migration
    text: How do you roll out a database schema change with zero downtime?
    probes: Expand and contract migrations, backfills and deploy ordering.
    follow_ups:
      - How would you roll it back?
