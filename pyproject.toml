[project]
name = "adk-voice-agent"
version = "0.3.0"
description = "Voice mock-interview coach: a live spoken interviewer for your target job, built on Google ADK, Gemini Live and FastAPI"
license = "MIT"
keywords = ["interview-practice", "mock-interview", "voice-agent", "google-adk", "gemini-live", "fastapi", "websockets", "realtime"]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "certifi>=2025.1.31",
  "fastapi>=0.116,<1",
  "google-adk>=2.3,<3",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent", "src/adk_voice_workshop"]

